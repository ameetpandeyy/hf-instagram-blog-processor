[tool.poetry]
name = "instagram-blog-processor"
version = "1.0.0"
description = "AI service for processing Instagram posts into blog articles"
authors = ["Ameet Pandey <ameet@ameetpandey.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
python-dotenv = "^1.0.0"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
instaloader = "^4.10.3"
google-generativeai = "^0.3.2"
Pillow = "^10.2.0"
transformers = "^4.36.2"
torch = "^2.1.2"
supabase = "^2.3.0"
httpx = "^0.26.0"
psutil = "^5.9.8"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
black = "^24.1.1"
pytest-cov = "^4.1.0"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
