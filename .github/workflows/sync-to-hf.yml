name: Sync to HuggingFace Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Add HuggingFace Space as remote
          git remote add space https://ameetspeaks:${HF_TOKEN}@huggingface.co/spaces/ameetspeaks/templeappai || true
          
          # Push to HuggingFace Space
          git push --force space main:main
          
          echo "? Successfully synced to HuggingFace Space!"
