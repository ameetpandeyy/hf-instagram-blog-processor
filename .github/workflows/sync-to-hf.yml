name: Sync to HuggingFace Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Add HuggingFace Space as remote with token in URL
          git remote add space https://ameetspeaks:$HF_TOKEN@huggingface.co/spaces/ameetspeaks/templeappai 2>/dev/null || git remote set-url space https://ameetspeaks:$HF_TOKEN@huggingface.co/spaces/ameetspeaks/templeappai
          
          # Push to HuggingFace Space
          git push space main:main --force
          
          echo "? Successfully synced to HuggingFace Space: https://huggingface.co/spaces/ameetspeaks/templeappai"
