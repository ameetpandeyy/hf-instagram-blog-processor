name: Process Instagram Queue (Direct)

on:
  schedule:
    # Every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  process-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: check-config
        run: |
          if [ -z "${{ secrets.WEBHOOK_SECRET }}" ]; then
            echo "⚠️  WEBHOOK_SECRET not configured yet"
            echo "configured=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "✅ Configuration ready"
          echo "configured=true" >> $GITHUB_OUTPUT
      
      - name: Fetch and process pending jobs
        if: steps.check-config.outputs.configured == 'true'
        env:
          SUPABASE_URL: https://rjknfmbgtrptusoqgzta.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HF_SPACE_URL: https://ameetspeaks-templeappai.hf.space
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          echo "🔍 Fetching pending jobs..."
          
          # Get first pending job
          JOB_DATA=$(curl -s "$SUPABASE_URL/rest/v1/processing_jobs?status=eq.pending&order=created_at.asc&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY")
          
          echo "Response: $JOB_DATA"
          
          # Check if we got a job
          if [ "$(echo $JOB_DATA | jq '. | length')" -eq "0" ]; then
            echo "✅ No pending jobs - queue is empty or all jobs completed!"
            exit 0
          fi
          
          # Extract job details
          JOB_ID=$(echo $JOB_DATA | jq -r '.[0].id')
          INSTAGRAM_URL=$(echo $JOB_DATA | jq -r '.[0].instagram_url')
          
          echo "📋 Found job: $JOB_ID"
          echo "🔗 Instagram URL: $INSTAGRAM_URL"
          
          # Trigger HF Space
          echo "🚀 Triggering HuggingFace Space..."
          
          PAYLOAD="{\"job_id\": \"$JOB_ID\", \"instagram_url\": \"$INSTAGRAM_URL\"}"
          
          RESPONSE=$(curl -X POST "$HF_SPACE_URL/webhook/process-job" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: $WEBHOOK_SECRET" \
            -d "$PAYLOAD" \
            -w "\n%{http_code}" \
            -s)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          if [ "$HTTP_CODE" -eq "200" ] || [ "$HTTP_CODE" -eq "202" ]; then
            echo "✅ Job triggered successfully!"
          else
            echo "❌ Failed to trigger job (HTTP $HTTP_CODE)"
            exit 1
          fi
