name: Generate Persona Images & Gallery

on:
  workflow_dispatch:
    inputs:
      personas:
        description: 'Persona IDs to generate (comma-separated or "all")'
        required: true
        default: 'all'
        type: string
      mode:
        description: 'Generation mode'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - avatars
          - gallery
      engine:
        description: 'Primary AI generation engine'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - gemini
          - huggingface
      delay:
        description: 'Delay in seconds between requests (rate limit prevention)'
        required: false
        default: '2'
        type: string
  schedule:
    # Optional scheduled monthly refresh on the 1st of every month at 03:00 UTC
    - cron: '0 3 1 * *'

jobs:
  generate-personas:
    name: Generate & Upload Persona Media
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Background Persona Image Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://nytryrbivykouxncuilu.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55dHJ5cmJpdnlrb3V4bmN1aWx1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNDUwODEsImV4cCI6MjEwODYyMTA4MX0._ll-CoNhA-SPiYgkkyhmQQQhXvfzgJwhQiu5acfLayQ' }}
        run: |
          PERSONAS="${{ inputs.personas || 'all' }}"
          MODE="${{ inputs.mode || 'all' }}"
          ENGINE="${{ inputs.engine || 'auto' }}"
          DELAY="${{ inputs.delay || '2' }}"

          echo "🚀 Starting automated image generation pipeline..."
          echo "• Target personas: $PERSONAS"
          echo "• Generation mode: $MODE"
          echo "• Engine: $ENGINE"
          echo "• Delay: ${DELAY}s"

          python scripts/generate_personas_background.py \
            --personas "$PERSONAS" \
            --mode "$MODE" \
            --engine "$ENGINE" \
            --delay "$DELAY"

      - name: Generate Workflow Summary
        if: always()
        run: |
          echo "### 🎨 TeAmo Persona Media Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Engine** | \`${{ inputs.engine || 'auto' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Mode** | \`${{ inputs.mode || 'all' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Personas** | \`${{ inputs.personas || 'all' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bucket** | \`persona-media\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All generated images are automatically compressed (<200KB) and live on Supabase CDN." >> $GITHUB_STEP_SUMMARY
